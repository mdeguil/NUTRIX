name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API Symfony (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NUTRIX-API
    env:
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

    services:
      postgres:
        image: postgres:16
        env:
          # Doctrine applique dbname_suffix "_test" en env=test (config/packages/doctrine.yaml) :
          # la base reellement ciblee est nutrix_test, pas nutrix. On cree directement nutrix_test
          # comme POSTGRES_DB pour que "doctrine:database:create" n'ait rien a faire (le role
          # postgres/nutrix cree par l'image a de toute facon tous les droits sur sa propre base).
          POSTGRES_DB: nutrix_test
          POSTGRES_USER: nutrix
          POSTGRES_PASSWORD: nutrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nutrix -d nutrix_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: NUTRIX-API/vendor
          key: composer-${{ hashFiles('NUTRIX-API/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax lint
        run: find src -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run tests
        run: php bin/phpunit
