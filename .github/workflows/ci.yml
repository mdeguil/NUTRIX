name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API Symfony (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NUTRIX-API
    env:
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nutrix
          MYSQL_USER: nutrix
          MYSQL_PASSWORD: nutrix
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: NUTRIX-API/vendor
          key: composer-${{ hashFiles('NUTRIX-API/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax lint
        run: find src -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run tests
        run: php bin/phpunit
